info:
  name: get deck
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/decks/{{deckId}}
  auth: inherit

runtime:
  variables:
    - name: deckId
      value: c014aa5f-5b32-4b08-8719-23d3b3606f17

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

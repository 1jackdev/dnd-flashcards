info:
  name: list flashcards by tag
  type: http
  seq: 24

http:
  method: GET
  url: http://localhost:3000/tags/flashcards?tags={{tag}}
  auth: inherit

runtime:
  variables:
    - name: tag
      value: condition

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

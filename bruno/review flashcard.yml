info:
  name: review flashcard
  type: http
  seq: 12

http:
  method: POST
  url: http://localhost:3000/flashcards/{{flashcardId}}/review
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  body:
    type: json
    data: |-
      {
        "rating": "perfect"
      }
  auth: inherit

runtime:
  variables:
    - name: token
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: review flashcard
  type: http
  seq: 12

http:
  method: POST
  url: http://localhost:3000/flashcards/{{flashcardId}}/review
  body:
    type: json
    data: |-
      {
        "rating": "perfect"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

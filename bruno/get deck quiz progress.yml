info:
  name: get deck quiz progress
  type: http
  seq: 20

http:
  method: GET
  url: http://localhost:3000/decks/{{deckId}}/quiz-progress
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  auth: inherit

runtime:
  variables:
    - name: token
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: record quiz attempt
  type: http
  seq: 19

http:
  method: POST
  url: http://localhost:3000/quiz/{{quizQuestionId}}/attempt
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  body:
    type: json
    data: |-
      {
        "correct": true
      }
  auth: inherit

runtime:
  variables:
    - name: token
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

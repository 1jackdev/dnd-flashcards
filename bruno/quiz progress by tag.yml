info:
  name: quiz progress by tag
  type: http
  seq: 27

http:
  method: GET
  url: http://localhost:3000/tags/quiz-progress?tags={{tag}}
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  auth: inherit

runtime:
  variables:
    - name: tag
      value: condition
    - name: token
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

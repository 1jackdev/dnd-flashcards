<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study by tag</title>
<style>
	:root {
		color-scheme: light dark;
		font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
	}

	body {
		max-width: 720px;
		margin: 2rem auto;
		padding: 0 1rem;
		color: #1a1a1a;
		background: #fafafa;
	}

	a {
		color: inherit;
	}

	.back-link {
		display: inline-block;
		margin-bottom: 1rem;
		font-size: 0.9rem;
		color: #555;
		text-decoration: none;
	}

	.back-link:hover {
		text-decoration: underline;
	}

	.top-bar {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		margin-bottom: 1rem;
	}

	h1 {
		font-size: 1.5rem;
		margin: 0;
	}

	.account-bar {
		font-size: 0.85rem;
		color: #555;
	}

	.account-bar a,
	.account-bar button {
		color: #555;
		background: none;
		border: none;
		padding: 0;
		font: inherit;
		cursor: pointer;
		text-decoration: underline;
	}

	p.hint {
		color: #555;
		margin: 0 0 1.5rem;
	}

	.tag-grid {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
		gap: 0.6rem;
		list-style: none;
		padding: 0;
		margin: 0 0 1.5rem;
	}

	.tag-option {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		padding: 0.6rem 0.8rem;
		border: 1px solid #ccc;
		border-radius: 6px;
		background: white;
		cursor: pointer;
	}

	.tag-option input {
		cursor: pointer;
	}

	.tag-option.checked {
		border-color: #1a1a1a;
		background: #f0f0f0;
	}

	.btn-primary {
		display: inline-block;
		padding: 0.6rem 1.2rem;
		border: 1px solid #1a1a1a;
		border-radius: 6px;
		background: #1a1a1a;
		color: white;
		font-size: 0.95rem;
		cursor: pointer;
		text-decoration: none;
	}

	.btn-primary:hover {
		background: #333;
	}

	.btn-primary:disabled {
		opacity: 0.4;
		cursor: not-allowed;
	}

	.status {
		text-align: center;
		color: #777;
		margin: 2rem 0;
	}

	@media (prefers-color-scheme: dark) {
		body {
			background: #1a1a1a;
			color: #eee;
		}

		.back-link,
		p.hint {
			color: #aaa;
		}

		.account-bar,
		.account-bar a,
		.account-bar button {
			color: #aaa;
		}

		.tag-option {
			background: #2a2a2a;
			border-color: #444;
			color: #eee;
		}

		.tag-option.checked {
			border-color: #eee;
			background: #333;
		}

		.btn-primary {
			background: #eee;
			color: #1a1a1a;
			border-color: #eee;
		}

		.btn-primary:hover {
			background: #ccc;
		}
	}
</style>
</head>
<body>
	<div class="top-bar" id="top-bar" hidden>
		<a class="back-link" href="decks.html">&larr; All decks</a>
		<div class="account-bar" id="account-bar"></div>
	</div>

	<div id="app-content" hidden>
		<h1>Study by tag</h1>
		<p class="hint">Pick one or more tags. You'll get flashcards, study, and quiz across every deck carrying those tags.</p>
		<ul id="tag-grid" class="tag-grid"></ul>
		<div id="status" class="status"></div>
		<button id="start-btn" type="button" class="btn-primary" disabled>Start</button>
	</div>

	<script>
		// Relative base: this page is always served by the same Hono server
		// that exposes the API (locally via serveStatic, in prod via Vercel),
		// so same-origin requests avoid CORS entirely.
		const API_BASE = "";

		function authHeaders() {
			const token = localStorage.getItem("authToken");
			return token ? { Authorization: `Bearer ${token}` } : {};
		}

		const tagGridEl = document.getElementById("tag-grid");
		const statusEl = document.getElementById("status");
		const startBtn = document.getElementById("start-btn");

		const selected = new Set();

		function updateStartBtn() {
			startBtn.disabled = selected.size === 0;
		}

		function renderTags(tags) {
			tagGridEl.innerHTML = "";
			for (const tag of tags) {
				const li = document.createElement("li");
				const label = document.createElement("label");
				label.className = "tag-option";

				const checkbox = document.createElement("input");
				checkbox.type = "checkbox";
				checkbox.value = tag;
				checkbox.addEventListener("change", () => {
					if (checkbox.checked) {
						selected.add(tag);
					} else {
						selected.delete(tag);
					}
					label.classList.toggle("checked", checkbox.checked);
					updateStartBtn();
				});

				const span = document.createElement("span");
				span.textContent = tag;

				label.append(checkbox, span);
				li.append(label);
				tagGridEl.append(li);
			}
		}

		startBtn.addEventListener("click", () => {
			if (selected.size === 0) return;
			const tagsQuery = [...selected].map(encodeURIComponent).join(",");
			location.href = `tag-session.html?tags=${tagsQuery}`;
		});

		async function loadTags() {
			statusEl.textContent = "Loading tags...";
			try {
				const res = await fetch(`${API_BASE}/tags`, { headers: authHeaders() });
				if (!res.ok) throw new Error(`Request failed: ${res.status}`);
				const tags = await res.json();
				statusEl.textContent = "";
				renderTags(tags);
			} catch (err) {
				statusEl.textContent = `Failed to load tags: ${err.message}`;
			}
		}

		function renderAccountBar() {
			const accountBarEl = document.getElementById("account-bar");
			accountBarEl.innerHTML = "";
			const logoutBtn = document.createElement("button");
			logoutBtn.type = "button";
			logoutBtn.textContent = "Log out";
			logoutBtn.addEventListener("click", () => {
				localStorage.removeItem("authToken");
				localStorage.removeItem("username");
				location.reload();
			});
			accountBarEl.append(logoutBtn);
		}

		if (!localStorage.getItem("authToken")) {
			location.href = `login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
		} else {
			document.getElementById("top-bar").hidden = false;
			document.getElementById("app-content").hidden = false;
			renderAccountBar();
			loadTags();
		}
	</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tag session</title>
<style>
	:root {
		color-scheme: light dark;
		font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
	}

	body {
		max-width: 960px;
		margin: 2rem auto;
		padding: 0 1rem;
		color: #1a1a1a;
		background: #fafafa;
	}

	a {
		color: inherit;
	}

	.back-link {
		display: inline-block;
		margin-bottom: 1rem;
		font-size: 0.9rem;
		color: #555;
		text-decoration: none;
	}

	.back-link:hover {
		text-decoration: underline;
	}

	h1 {
		font-size: 1.5rem;
		margin: 0 0 0.25rem;
	}

	.deck-description {
		color: #555;
		margin: 0 0 1.5rem;
	}

	.tabs {
		display: flex;
		gap: 0.5rem;
		margin-bottom: 1.5rem;
		border-bottom: 1px solid #ddd;
	}

	.tab-btn {
		padding: 0.5rem 1rem;
		border: none;
		background: none;
		font-size: 0.95rem;
		cursor: pointer;
		color: #666;
		border-bottom: 2px solid transparent;
		margin-bottom: -1px;
	}

	.tab-btn.active {
		color: #1a1a1a;
		border-bottom-color: #1a1a1a;
		font-weight: 600;
	}

	.view {
		display: none;
	}

	.view.active {
		display: block;
	}

	#search {
		width: 100%;
		box-sizing: border-box;
		padding: 0.5rem 0.75rem;
		font-size: 1rem;
		border: 1px solid #ccc;
		border-radius: 6px;
		margin-bottom: 1.5rem;
	}

	.card-list {
		list-style: none;
		padding: 0;
		margin: 0;
		display: grid;
		grid-template-columns: repeat(3, 1fr);
		gap: 0.75rem;
	}

	@media (max-width: 720px) {
		.card-list {
			grid-template-columns: repeat(2, 1fr);
		}
	}

	@media (max-width: 480px) {
		.card-list {
			grid-template-columns: 1fr;
		}
	}

	.flashcard-item {
		perspective: 1000px;
		min-height: 160px;
	}

	.flip-card {
		position: relative;
		width: 100%;
		height: 100%;
		min-height: 160px;
		cursor: pointer;
		transform-style: preserve-3d;
		transition: transform 0.5s;
	}

	.flip-card.flipped {
		transform: rotateY(180deg);
	}

	.flip-face {
		position: absolute;
		inset: 0;
		backface-visibility: hidden;
		background: white;
		border: 1px solid #e0e0e0;
		border-radius: 8px;
		padding: 1rem;
		box-sizing: border-box;
		display: flex;
		flex-direction: column;
	}

	.flip-face.flip-back {
		transform: rotateY(180deg);
	}

	.flashcard-item .front {
		font-weight: 600;
		margin: 0 0 0.4rem;
	}

	.flashcard-item .back {
		margin: 0;
		color: #555;
		font-size: 0.9rem;
	}

	.flip-hint {
		margin-top: auto;
		padding-top: 0.5rem;
		font-size: 0.7rem;
		color: #999;
	}

	.tags {
		margin-top: 0.5rem;
		display: flex;
		gap: 0.4rem;
		flex-wrap: wrap;
	}

	.tag {
		font-size: 0.7rem;
		background: #eee;
		color: #555;
		border-radius: 999px;
		padding: 0.15rem 0.6rem;
	}

	.pagination {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 1rem;
		margin-top: 1.5rem;
	}

	.pagination button {
		padding: 0.4rem 0.9rem;
		border: 1px solid #ccc;
		border-radius: 6px;
		background: white;
		cursor: pointer;
		font-size: 0.9rem;
	}

	.pagination button:disabled {
		opacity: 0.4;
		cursor: not-allowed;
	}

	.status {
		text-align: center;
		color: #777;
		margin: 2rem 0;
	}

	.session-summary {
		text-align: center;
		color: #777;
		font-size: 0.85rem;
		margin: 0 auto 1rem;
		max-width: 560px;
	}

	.study-card,
	.quiz-card {
		background: white;
		border: 1px solid #e0e0e0;
		border-radius: 10px;
		padding: 1.5rem;
		text-align: center;
		max-width: 560px;
		margin: 0 auto;
	}

	.study-card .front,
	.quiz-card .question {
		font-size: 1.15rem;
		font-weight: 600;
		margin: 0 0 1rem;
	}

	.study-card .back {
		font-size: 1rem;
		color: #444;
		margin: 0 0 1rem;
		padding-top: 1rem;
		border-top: 1px dashed #ddd;
	}

	.study-card .progress-line {
		font-size: 0.8rem;
		color: #888;
		margin-bottom: 1rem;
	}

	.btn {
		padding: 0.5rem 1rem;
		border: 1px solid #ccc;
		border-radius: 6px;
		background: white;
		cursor: pointer;
		font-size: 0.9rem;
	}

	.btn:hover {
		background: #f0f0f0;
	}

	.btn-primary {
		background: #1a1a1a;
		color: white;
		border-color: #1a1a1a;
	}

	.btn-primary:hover {
		background: #333;
	}

	#quiz-restart-btn {
		display: block;
		margin: 0 auto;
	}

	.rating-row {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		justify-content: center;
		margin-top: 0.5rem;
	}

	.choice-list {
		list-style: none;
		padding: 0;
		margin: 0 0 1rem;
		display: flex;
		flex-direction: column;
		gap: 0.5rem;
	}

	.choice-btn {
		width: 100%;
		text-align: left;
		padding: 0.6rem 0.9rem;
		border: 1px solid #ccc;
		border-radius: 6px;
		background: white;
		cursor: pointer;
		font-size: 0.95rem;
	}

	.choice-btn:hover:not(:disabled) {
		background: #f0f0f0;
	}

	.choice-btn.correct {
		border-color: #2e7d32;
		background: #e8f5e9;
	}

	.choice-btn.incorrect {
		border-color: #c62828;
		background: #fdecea;
	}

	.choice-btn:disabled {
		cursor: default;
		opacity: 0.85;
	}

	.feedback {
		font-weight: 600;
		margin: 0.75rem 0;
	}

	.feedback.correct-text {
		color: #2e7d32;
	}

	.feedback.incorrect-text {
		color: #c62828;
	}

	@media (prefers-color-scheme: dark) {
		body {
			background: #1a1a1a;
			color: #eee;
		}

		.back-link,
		.deck-description {
			color: #aaa;
		}

		.tabs {
			border-bottom-color: #333;
		}

		.tab-btn {
			color: #999;
		}

		.tab-btn.active {
			color: #eee;
			border-bottom-color: #eee;
		}

		#search {
			background: #2a2a2a;
			border-color: #444;
			color: #eee;
		}

		.flip-face,
		.study-card,
		.quiz-card {
			background: #242424;
			border-color: #3a3a3a;
		}

		.flashcard-item .back {
			color: #bbb;
		}

		.flip-hint {
			color: #777;
		}

		.study-card .back {
			color: #ddd;
			border-top-color: #3a3a3a;
		}

		.tag {
			background: #333;
			color: #ccc;
		}

		.pagination button,
		.btn,
		.choice-btn {
			background: #2a2a2a;
			border-color: #444;
			color: #eee;
		}

		.pagination button:not(:disabled):hover,
		.btn:hover {
			background: #383838;
		}

		.btn-primary {
			background: #eee;
			color: #1a1a1a;
			border-color: #eee;
		}

		.btn-primary:hover {
			background: #ccc;
		}

		.choice-btn:hover:not(:disabled) {
			background: #383838;
		}

		.study-card .back {
			border-top-color: #3a3a3a;
		}

		.choice-btn.correct {
			border-color: #66bb6a;
			background: #1b3320;
		}

		.choice-btn.incorrect {
			border-color: #ef5350;
			background: #3a1f1e;
		}
	}
</style>
</head>
<body>
	<a class="back-link" href="tags.html">&larr; Tag picker</a>
	<h1 id="deck-name">Loading…</h1>
	<p class="deck-description" id="deck-description"></p>

	<div class="tabs">
		<button class="tab-btn active" type="button" data-view="flashcards">Flashcards</button>
		<button class="tab-btn" type="button" data-view="study">Study</button>
		<button class="tab-btn" type="button" data-view="quiz">Quiz</button>
	</div>

	<!-- Flashcards view -->
	<section id="view-flashcards" class="view active">
		<input id="search" type="text" placeholder="Search flashcards..." autocomplete="off" />
		<ul id="card-list" class="card-list"></ul>
		<div id="card-status" class="status"></div>
		<div id="card-pagination" class="pagination" hidden>
			<button id="card-prev-btn" type="button" class="btn">Previous</button>
			<span id="card-page-label"></span>
			<button id="card-next-btn" type="button" class="btn">Next</button>
		</div>
	</section>

	<!-- Study view -->
	<section id="view-study" class="view">
		<div id="study-status" class="status"></div>
		<div id="study-body" hidden>
			<div class="session-summary" id="study-position"></div>
			<div class="study-card">
				<p class="front" id="study-front"></p>
				<p class="back" id="study-back" hidden></p>
				<p class="progress-line" id="study-progress-line"></p>
				<button id="reveal-btn" type="button" class="btn btn-primary">Reveal answer</button>
				<div class="rating-row" id="rating-row" hidden>
					<button class="btn" type="button" data-rating="blackout">Blackout</button>
					<button class="btn" type="button" data-rating="wrong">Wrong</button>
					<button class="btn" type="button" data-rating="familiar_wrong">Familiar</button>
					<button class="btn" type="button" data-rating="difficult">Difficult</button>
					<button class="btn" type="button" data-rating="correct">Correct</button>
					<button class="btn" type="button" data-rating="perfect">Perfect</button>
				</div>
			</div>
		</div>
	</section>

	<!-- Quiz view -->
	<section id="view-quiz" class="view">
		<div id="quiz-status" class="status"></div>
		<button id="quiz-restart-btn" type="button" class="btn" hidden>Retake quiz</button>
		<div id="quiz-body" hidden>
			<div class="session-summary" id="quiz-score"></div>
			<div class="quiz-card">
				<p class="question" id="quiz-question"></p>
				<ul class="choice-list" id="quiz-choices"></ul>
				<p class="feedback" id="quiz-feedback" hidden></p>
				<button id="quiz-reveal-btn" type="button" class="btn" hidden>Reveal answer</button>
				<button id="quiz-next-btn" type="button" class="btn btn-primary" hidden>Next question</button>
			</div>
		</div>
	</section>

	<script>
		// Relative base: this page is always served by the same Hono server
		// that exposes the API (locally via serveStatic, in prod via Vercel),
		// so same-origin requests avoid CORS entirely.
		const API_BASE = "";

		const params = new URLSearchParams(location.search);
		const tags = (params.get("tags") || "")
			.split(",")
			.map((t) => t.trim())
			.filter(Boolean);
		const tagsQuery = tags.map(encodeURIComponent).join(",");

		const deckNameEl = document.getElementById("deck-name");
		const deckDescriptionEl = document.getElementById("deck-description");

		if (tags.length === 0) {
			deckNameEl.textContent = "No tags selected";
			deckDescriptionEl.textContent = "Missing ?tags= query parameter.";
		} else {
			deckNameEl.textContent = `Tags: ${tags.join(", ")}`;
			deckDescriptionEl.textContent = "Flashcards, study, and quiz across every deck carrying these tags.";
		}

		// ---------- Tabs ----------
		const tabButtons = document.querySelectorAll(".tab-btn");
		const views = {
			flashcards: document.getElementById("view-flashcards"),
			study: document.getElementById("view-study"),
			quiz: document.getElementById("view-quiz"),
		};

		let studyStarted = false;
		let quizStarted = false;

		for (const btn of tabButtons) {
			btn.addEventListener("click", () => {
				for (const b of tabButtons) b.classList.remove("active");
				btn.classList.add("active");
				for (const key of Object.keys(views)) views[key].classList.remove("active");
				const view = btn.dataset.view;
				views[view].classList.add("active");

				if (view === "study" && !studyStarted) {
					studyStarted = true;
					loadStudy();
				}
				if (view === "quiz" && !quizStarted) {
					quizStarted = true;
					loadQuiz();
				}
			});
		}

		// ---------- Flashcards view ----------
		const PAGE_SIZE = 6;
		let allCards = [];
		let filteredCards = [];
		let cardPage = 1;

		const searchInput = document.getElementById("search");
		const cardListEl = document.getElementById("card-list");
		const cardStatusEl = document.getElementById("card-status");
		const cardPaginationEl = document.getElementById("card-pagination");
		const cardPrevBtn = document.getElementById("card-prev-btn");
		const cardNextBtn = document.getElementById("card-next-btn");
		const cardPageLabel = document.getElementById("card-page-label");

		function cardTotalPages() {
			return Math.max(1, Math.ceil(filteredCards.length / PAGE_SIZE));
		}

		function renderCards() {
			cardListEl.innerHTML = "";

			if (filteredCards.length === 0) {
				cardStatusEl.textContent = "No flashcards found.";
				cardPaginationEl.hidden = true;
				return;
			}

			cardStatusEl.textContent = "";
			cardPaginationEl.hidden = false;

			const start = (cardPage - 1) * PAGE_SIZE;
			const pageItems = filteredCards.slice(start, start + PAGE_SIZE);

			for (const card of pageItems) {
				const li = document.createElement("li");
				li.className = "flashcard-item";

				const flipCard = document.createElement("div");
				flipCard.className = "flip-card";
				flipCard.addEventListener("click", () => flipCard.classList.toggle("flipped"));

				const cardTags = document.createElement("div");
				cardTags.className = "tags";
				for (const tag of card.tags || []) {
					const span = document.createElement("span");
					span.className = "tag";
					span.textContent = tag;
					cardTags.append(span);
				}

				const front = document.createElement("div");
				front.className = "flip-face flip-front";
				const frontText = document.createElement("p");
				frontText.className = "front";
				frontText.textContent = card.front;
				const flipHint = document.createElement("div");
				flipHint.className = "flip-hint";
				flipHint.textContent = "Click to reveal answer";
				front.append(frontText, cardTags, flipHint);

				const back = document.createElement("div");
				back.className = "flip-face flip-back";
				const backText = document.createElement("p");
				backText.className = "back";
				backText.textContent = card.back;
				back.append(backText);

				flipCard.append(front, back);
				li.append(flipCard);
				cardListEl.append(li);
			}

			cardPageLabel.textContent = `Page ${cardPage} of ${cardTotalPages()}`;
			cardPrevBtn.disabled = cardPage <= 1;
			cardNextBtn.disabled = cardPage >= cardTotalPages();
		}

		function applyCardFilter(query) {
			const q = query.trim().toLowerCase();
			filteredCards = q
				? allCards.filter(
						(card) => card.front.toLowerCase().includes(q) || card.back.toLowerCase().includes(q),
					)
				: allCards.slice();
			cardPage = 1;
			renderCards();
		}

		searchInput.addEventListener("input", (e) => applyCardFilter(e.target.value));

		cardPrevBtn.addEventListener("click", () => {
			if (cardPage > 1) {
				cardPage -= 1;
				renderCards();
			}
		});

		cardNextBtn.addEventListener("click", () => {
			if (cardPage < cardTotalPages()) {
				cardPage += 1;
				renderCards();
			}
		});

		async function loadFlashcards() {
			cardStatusEl.textContent = "Loading flashcards...";
			try {
				const res = await fetch(`${API_BASE}/tags/flashcards?tags=${tagsQuery}`);
				if (!res.ok) throw new Error(`Request failed: ${res.status}`);
				allCards = await res.json();
				applyCardFilter(searchInput.value);
			} catch (err) {
				cardStatusEl.textContent = `Failed to load flashcards: ${err.message}`;
				cardPaginationEl.hidden = true;
			}
		}

		// ---------- Study view ----------
		let studyQueue = [];
		let studyIndex = 0;

		const studyStatusEl = document.getElementById("study-status");
		const studyBodyEl = document.getElementById("study-body");
		const studyPositionEl = document.getElementById("study-position");
		const studyFrontEl = document.getElementById("study-front");
		const studyBackEl = document.getElementById("study-back");
		const studyProgressLineEl = document.getElementById("study-progress-line");
		const revealBtn = document.getElementById("reveal-btn");
		const ratingRow = document.getElementById("rating-row");

		function describeProgress(progress) {
			if (!progress) return "Not studied yet.";
			const last = progress.lastReviewedAt ? new Date(progress.lastReviewedAt) : null;
			const lastText = last && !Number.isNaN(last.getTime()) ? last.toLocaleDateString() : "never";
			return `Interval: ${progress.interval}d · Repetitions: ${progress.repetitions} · Last reviewed: ${lastText}`;
		}

		function renderStudyCard() {
			if (studyQueue.length === 0) {
				studyBodyEl.hidden = true;
				studyStatusEl.textContent = "No flashcards match these tags.";
				return;
			}

			if (studyIndex >= studyQueue.length) {
				studyBodyEl.hidden = true;
				studyStatusEl.textContent = "Session complete. Nice work!";
				return;
			}

			studyStatusEl.textContent = "";
			studyBodyEl.hidden = false;

			const { flashcard, progress } = studyQueue[studyIndex];
			studyPositionEl.textContent = `Card ${studyIndex + 1} of ${studyQueue.length}`;
			studyFrontEl.textContent = flashcard.front;
			studyBackEl.textContent = flashcard.back;
			studyBackEl.hidden = true;
			studyProgressLineEl.textContent = describeProgress(progress);
			revealBtn.hidden = false;
			ratingRow.hidden = true;
		}

		revealBtn.addEventListener("click", () => {
			studyBackEl.hidden = false;
			revealBtn.hidden = true;
			ratingRow.hidden = false;
		});

		for (const btn of ratingRow.querySelectorAll("button")) {
			btn.addEventListener("click", async () => {
				const { flashcard } = studyQueue[studyIndex];
				const rating = btn.dataset.rating;
				try {
					await fetch(`${API_BASE}/flashcards/${flashcard.id}/review`, {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ rating }),
					});
				} catch {
					// best-effort; still advance locally so the session isn't blocked
				}
				studyIndex += 1;
				renderStudyCard();
			});
		}

		async function loadStudy() {
			studyStatusEl.textContent = "Loading study session...";
			studyBodyEl.hidden = true;
			try {
				const res = await fetch(`${API_BASE}/tags/study?tags=${tagsQuery}`);
				if (!res.ok) throw new Error(`Request failed: ${res.status}`);
				const summary = await res.json();
				studyQueue = summary.cards;
				studyIndex = 0;
				renderStudyCard();
			} catch (err) {
				studyStatusEl.textContent = `Failed to load study session: ${err.message}`;
			}
		}

		// ---------- Quiz view ----------
		let quizQuestions = [];
		let quizIndex = 0;
		let quizCorrectCount = 0;
		let quizAnsweredCount = 0;

		const quizStatusEl = document.getElementById("quiz-status");
		const quizBodyEl = document.getElementById("quiz-body");
		const quizScoreEl = document.getElementById("quiz-score");
		const quizQuestionEl = document.getElementById("quiz-question");
		const quizChoicesEl = document.getElementById("quiz-choices");
		const quizFeedbackEl = document.getElementById("quiz-feedback");
		const quizRevealBtn = document.getElementById("quiz-reveal-btn");
		const quizNextBtn = document.getElementById("quiz-next-btn");
		const quizRestartBtn = document.getElementById("quiz-restart-btn");

		let currentChoiceButtons = [];

		function updateQuizScore() {
			quizScoreEl.textContent = `Question ${Math.min(quizIndex + 1, quizQuestions.length)} of ${quizQuestions.length} · Score: ${quizCorrectCount}/${quizAnsweredCount}`;
		}

		function choicesFor(question) {
			if (question.type === "true_false") {
				return [
					{ label: "True", isCorrect: question.correctAnswer === true },
					{ label: "False", isCorrect: question.correctAnswer === false },
				];
			}
			return question.choices.map((choice, i) => ({
				label: choice,
				isCorrect: i === question.correctChoiceIndex,
			}));
		}

		function renderQuizQuestion() {
			if (quizQuestions.length === 0) {
				quizBodyEl.hidden = true;
				quizStatusEl.textContent = "No quiz questions match these tags.";
				return;
			}

			if (quizIndex >= quizQuestions.length) {
				quizBodyEl.hidden = true;
				quizRestartBtn.hidden = false;
				quizStatusEl.textContent = `Quiz complete! Final score: ${quizCorrectCount}/${quizAnsweredCount}`;
				return;
			}

			quizRestartBtn.hidden = true;
			quizStatusEl.textContent = "";
			quizBodyEl.hidden = false;
			quizFeedbackEl.hidden = true;
			quizRevealBtn.hidden = true;
			quizNextBtn.hidden = true;
			updateQuizScore();

			const question = quizQuestions[quizIndex];
			quizQuestionEl.textContent = question.question;
			quizChoicesEl.innerHTML = "";
			currentChoiceButtons = [];

			for (const choice of choicesFor(question)) {
				const li = document.createElement("li");
				const btn = document.createElement("button");
				btn.type = "button";
				btn.className = "choice-btn";
				btn.textContent = choice.label;
				btn.addEventListener("click", () => answerQuiz(choice.isCorrect, btn));
				li.append(btn);
				quizChoicesEl.append(li);
				currentChoiceButtons.push({ btn, isCorrect: choice.isCorrect });
			}
		}

		function answerQuiz(isCorrect, chosenBtn) {
			quizAnsweredCount += 1;
			if (isCorrect) quizCorrectCount += 1;

			for (const { btn } of currentChoiceButtons) {
				btn.disabled = true;
			}
			chosenBtn.classList.add(isCorrect ? "correct" : "incorrect");

			quizFeedbackEl.hidden = false;
			quizFeedbackEl.textContent = isCorrect ? "Correct!" : "Not quite.";
			quizFeedbackEl.className = `feedback ${isCorrect ? "correct-text" : "incorrect-text"}`;

			updateQuizScore();
			quizRevealBtn.hidden = isCorrect;
			quizNextBtn.hidden = false;
		}

		quizRevealBtn.addEventListener("click", () => {
			const correctChoice = currentChoiceButtons.find((c) => c.isCorrect);
			if (correctChoice) correctChoice.btn.classList.add("correct");
			quizRevealBtn.hidden = true;
		});

		quizNextBtn.addEventListener("click", () => {
			quizIndex += 1;
			renderQuizQuestion();
		});

		quizRestartBtn.addEventListener("click", () => {
			quizQuestions = shuffle(quizQuestions);
			quizIndex = 0;
			quizCorrectCount = 0;
			quizAnsweredCount = 0;
			renderQuizQuestion();
		});

		function shuffle(items) {
			const shuffled = items.slice();
			for (let i = shuffled.length - 1; i > 0; i -= 1) {
				const j = Math.floor(Math.random() * (i + 1));
				[shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
			}
			return shuffled;
		}

		async function loadQuiz() {
			quizStatusEl.textContent = "Loading quiz...";
			quizBodyEl.hidden = true;
			try {
				const res = await fetch(`${API_BASE}/tags/quiz?tags=${tagsQuery}`);
				if (!res.ok) throw new Error(`Request failed: ${res.status}`);
				quizQuestions = shuffle(await res.json());
				quizIndex = 0;
				quizCorrectCount = 0;
				quizAnsweredCount = 0;
				renderQuizQuestion();
			} catch (err) {
				quizStatusEl.textContent = `Failed to load quiz: ${err.message}`;
			}
		}

		// ---------- Init ----------
		if (tags.length > 0) {
			loadFlashcards();
		}
	</script>
</body>
</html>
